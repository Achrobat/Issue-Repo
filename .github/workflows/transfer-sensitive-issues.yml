name: Transfer sensitive issues

on:
  issues:
    types:
      - labeled

concurrency:
  group: transfer-sensitive-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer sensitive issue to private repo
    runs-on: ubuntu-latest

    if: github.event.label.name == 'sensitive-report'

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            Issue-Repo
            Dupes-And-Exploits

      - name: Transfer issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          DESTINATION_REPO: Achrobat/Dupes-And-Exploits
        run: |
          gh issue transfer "$ISSUE_URL" "$DESTINATION_REPO"
