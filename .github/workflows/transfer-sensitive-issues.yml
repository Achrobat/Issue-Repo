name: Transfer sensitive issues

on:
  issues:
    types:
      - labeled

concurrency:
  group: transfer-sensitive-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer Exploits to Private Repo
    runs-on: ubuntu-latest

    if: >
      contains(github.event.issue.labels.*.name, 'Exploit')

    steps:
      - name: Transfer Issue
        env:
          GH_TOKEN: ${{ secrets.ISSUE_TRANSFER_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          DESTINATION_REPO: Achrobat/Dupes-And-Exploits
        run: |
          gh issue transfer "$ISSUE_URL" "$DESTINATION_REPO"
